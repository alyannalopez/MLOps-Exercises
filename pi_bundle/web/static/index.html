<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VCM · Smart Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#ffffff;
    --paper:#fbfaf7;
    --ink:#2b2620;
    --ink-soft:#6b6258;
    --gold:#c9a227;
    --gold-deep:#a67c00;
    --gold-soft:#f3e6bd;
    --gold-line:#e6d48a;
    --blue:#1f5fe0;
    --blue-soft:#eaf1ff;
    --blue-line:#bcd2ff;
    --ok:#1f9d55;
    --shadow:0 10px 30px rgba(80,60,10,.10);
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 80% -10%, #fff8e6 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 110%, #f4f8ff 0%, transparent 55%),
      var(--paper);
    min-height:100vh;
  }

  /* ── header (minimal, floats over the orb stage) ── */
  header{
    position:fixed;top:0;left:0;right:0;z-index:20;
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 22px;pointer-events:none;
  }
  .brand{display:flex;align-items:center;gap:12px;pointer-events:auto}
  .crest{
    width:44px;height:44px;border-radius:12px;
    background:linear-gradient(145deg,#f7ecc4,#e7cf74);
    border:1px solid var(--gold-line);
    display:grid;place-items:center;font-size:22px;
    box-shadow:var(--shadow);
  }
  .brand h1{
    font-family:'Cormorant Garamond',serif;font-weight:700;
    font-size:24px;letter-spacing:.5px;line-height:1;
  }
  .brand h1 b{color:var(--gold-deep)}
  .brand p{font-size:11.5px;color:var(--ink-soft);margin-top:3px;letter-spacing:.3px}
  .top-right{display:flex;align-items:center;gap:12px;pointer-events:auto}
  .pill{
    display:flex;align-items:center;gap:8px;
    background:#fff;border:1px solid var(--gold-line);
    padding:8px 14px;border-radius:999px;font-size:12px;font-weight:600;
    color:var(--gold-deep);box-shadow:var(--shadow);
  }
  .dot{width:9px;height:9px;border-radius:50%;background:#c9c2b6;transition:.2s}
  .dot.live{background:var(--ok);box-shadow:0 0 0 4px rgba(31,157,85,.18)}
  .ghost-btn{
    font-family:'Inter';font-weight:600;font-size:12px;cursor:pointer;
    border-radius:999px;padding:8px 14px;border:1px solid var(--blue-line);
    background:#fff;color:var(--blue);transition:.15s;box-shadow:var(--shadow);
  }
  .ghost-btn:hover{background:var(--blue-soft)}

  /* ── STAGE: the whole viewport is the orb scene ── */
  .stage{
    position:fixed;inset:0;display:grid;place-items:center;
    transition:opacity .45s ease, transform .45s ease;
  }
  .stage.hidden{opacity:0;transform:scale(.94);pointer-events:none}

  .orb-stack{display:flex;flex-direction:column;align-items:center;gap:26px;padding:0 20px}
  .orb{
    position:relative;width:260px;height:260px;display:grid;place-items:center;cursor:pointer;
    user-select:none;-webkit-tap-highlight-color:transparent;
  }
  .ring{position:absolute;border-radius:50%;border:2px solid var(--gold-line);opacity:.5}
  .ring.r1{width:260px;height:260px}
  .ring.r2{width:260px;height:260px;animation:pulse 2.6s ease-out infinite}
  .ring.r3{width:260px;height:260px;animation:pulse 2.6s ease-out infinite 1.3s}
  @keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.5);opacity:0}}
  .core{
    width:190px;height:190px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fffdf6, #f3e6bd 70%, #ecd89a);
    border:2px solid var(--gold);
    display:grid;place-items:center;
    box-shadow:0 16px 40px rgba(166,124,0,.30), inset 0 2px 12px rgba(255,255,255,.85);
    transition:transform .12s ease, box-shadow .25s;
  }
  .core svg{width:78px;height:78px;fill:var(--gold-deep)}
  .orb.listening .core{transform:scale(1.06);
    box-shadow:0 0 0 8px rgba(31,95,224,.14),0 16px 44px rgba(31,95,224,.32)}
  .orb.listening .core svg{fill:var(--blue)}
  .orb.listening .ring{border-color:var(--blue-line)}
  /* armed = wake word heard, waiting for the command: blue + faster pulse */
  .orb.armed .core{transform:scale(1.10);
    box-shadow:0 0 0 10px rgba(31,95,224,.20),0 18px 48px rgba(31,95,224,.42)}
  .orb.armed .core svg{fill:var(--blue)}
  .orb.armed .ring{border-color:var(--blue)}
  .orb.armed .ring.r2{animation-duration:1.1s}
  .orb.armed .ring.r3{animation-duration:1.1s;animation-delay:.55s}

  .bar{width:min(320px,70vw);height:6px;border-radius:6px;background:#efe9dc;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;
    background:linear-gradient(90deg,var(--gold),var(--blue));transition:width .1s}
  .hint{font-size:14px;color:var(--ink-soft);text-align:center;max-width:340px;line-height:1.55}
  .hint b{color:var(--gold-deep)}
  .hint .ex{display:block;margin-top:6px;font-size:12.5px;color:#a89f92}

  /* ── PANEL: slides in over the stage when a command fires ── */
  .panel{
    position:fixed;inset:0;z-index:10;overflow-y:auto;
    padding:84px 22px 60px;
    opacity:0;transform:translateY(14px);pointer-events:none;
    transition:opacity .4s ease, transform .4s ease;
    background:
      radial-gradient(1200px 600px at 80% -10%, #fff8e6 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 110%, #f4f8ff 0%, transparent 55%),
      var(--paper);
  }
  .panel.show{opacity:1;transform:none;pointer-events:auto}
  .panel .inner{max-width:900px;margin:0 auto}

  /* the popped-up tile for the command that just fired */
  .hero{
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    background:#fff;border:1px solid var(--gold-line);border-left:5px solid var(--gold);
    border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:18px;
    animation:pop .45s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes pop{0%{opacity:0;transform:scale(.9) translateY(10px)}100%{opacity:1;transform:none}}
  .hero .ic{font-size:40px;line-height:1}
  .hero .txt{flex:1;min-width:200px}
  .hero .intent{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;line-height:1}
  .hero .status{margin-top:6px;font-size:15px;color:var(--ink)}
  .hero .meta{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
  .conf{font-size:12.5px;font-weight:700;color:var(--blue);background:var(--blue-soft);
    padding:4px 10px;border-radius:999px}
  .lat{font-size:11px;color:var(--ink-soft)}
  .top3{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
  .chip{font-size:11px;font-weight:600;color:var(--ink-soft);
    border:1px solid #eee;padding:4px 8px;border-radius:8px;background:#fff}
  .chip b{color:var(--gold-deep)}

  /* the affected device tile(s) */
  .devices{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
  .dev{
    position:relative;border:1px solid var(--blue-line);border-radius:14px;padding:18px;
    background:#fff;overflow:hidden;
    box-shadow:0 0 0 3px rgba(31,95,224,.10), var(--shadow);
    animation:pop .5s cubic-bezier(.2,.9,.3,1.2) .05s backwards;
  }
  .dev::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;
    background:linear-gradient(90deg,var(--gold),var(--blue))}
  .dev .ic{font-size:26px}
  .dev .lbl{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
    color:var(--ink-soft);margin-top:8px}
  .dev .val{font-size:20px;font-weight:700;margin-top:2px}
  .dev .sub{font-size:12px;color:var(--ink-soft);margin-top:2px}

  /* light visual */
  .bulb{width:54px;height:54px;border-radius:50%;margin:0 auto;
    background:#efe9dc;border:2px solid #e2dac6;transition:.3s}
  .bulb.on{background:radial-gradient(circle,#fff6cf,#ffd34d);
    box-shadow:0 0 26px 6px rgba(255,200,60,.7);border-color:var(--gold)}
  .swatch{width:100%;height:12px;border-radius:6px;margin-top:10px;border:1px solid #eee;transition:.3s}
  .meter{height:9px;border-radius:6px;background:#efe9dc;overflow:hidden;margin-top:10px}
  .meter>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-deep));transition:width .4s}
  .timer-ring{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:700}

  /* back + recent */
  .panel-actions{display:flex;gap:10px;margin-bottom:18px}
  .panel-actions button{
    font-family:'Inter';font-weight:600;font-size:13px;cursor:pointer;
    border-radius:12px;padding:11px 16px;border:1px solid var(--gold-line);
    background:#fff;color:var(--gold-deep);transition:.15s;
  }
  .panel-actions button:hover{background:var(--gold-soft)}
  .panel-actions button.primary{
    border:none;color:#fff;background:linear-gradient(135deg,var(--gold),var(--gold-deep));
    box-shadow:0 8px 18px rgba(166,124,0,.28);
  }
  .panel-actions button.primary:hover{filter:brightness(1.05)}

  .recent{margin-top:24px}
  .recent h3{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;margin-bottom:12px}
  .recent ul{list-style:none;display:flex;flex-direction:column;gap:7px}
  .recent li{display:flex;gap:10px;align-items:center;font-size:12.5px;
    padding:10px 12px;border:1px solid #efe9dc;border-radius:10px;background:#fff;
    animation:slidein .3s ease}
  @keyframes slidein{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
  .recent li .t{color:var(--ink-soft);font-variant-numeric:tabular-nums;font-size:11px}
  .recent li .m{color:var(--gold-deep);font-weight:600}
  .recent .empty{color:var(--ink-soft);font-size:12.5px;text-align:center;padding:10px}

  footer{position:fixed;bottom:0;left:0;right:0;text-align:center;
    margin-top:26px;font-size:11px;color:#b3aa9c;z-index:5;pointer-events:none}
  footer b{color:var(--gold-deep)}
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="crest">🏛️</div>
      <div>
        <h1>VCM · <b>Smart Home</b></h1>
        <p>Voice Command Model — CRNN · openWakeWord pipeline</p>
      </div>
    </div>
    <div class="top-right">
      <div class="pill"><span class="dot" id="conn"></span><span id="connTxt">connecting…</span></div>
      <button class="ghost-btn" id="resetBtnTop">↺ Reset home</button>
    </div>
  </header>

  <!-- ── STAGE: just the orb ── -->
  <div class="stage" id="stage">
    <div class="orb-stack">
      <div class="orb" id="orb">
        <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
        <div class="core">
          <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg>
        </div>
      </div>
      <div class="bar"><i id="level"></i></div>
      <p class="hint" id="hint">Say <b>&ldquo;hey jarvis&rdquo;</b> &mdash; I&rsquo;m listening.</p>
    </div>
  </div>

  <!-- ── PANEL: pops up per command ── -->
  <div class="panel" id="panel">
    <div class="inner">
      <div class="hero" id="hero" style="display:none">
        <div class="ic" id="heroIc">💬</div>
        <div class="txt">
          <div class="intent" id="intentName">—</div>
          <div class="status" id="statusMsg">—</div>
          <div class="meta">
            <span class="conf" id="conf">—</span>
            <span class="lat" id="lat"></span>
          </div>
          <div class="top3" id="top3"></div>
        </div>
      </div>

      <div class="devices" id="devices"></div>

      <div class="panel-actions">
        <button class="primary" id="againBtn">🎙️  Say another command</button>
      </div>

      <div class="recent">
        <h3>Recent commands</h3>
        <ul id="logList"><div class="empty">Commands you give will be logged here.</div></ul>
      </div>
    </div>
  </div>

  <footer>Built on the <b>ME2 CRNN</b> (718k params · 20 intents) · A100-retrained · ONNX runtime</footer>

<script>
const $ = id => document.getElementById(id);
let ws, audioCtx, stream, analyser, rafId, recording=false;
let phase='boot';            // boot -> idle(listening for wake) -> armed(waiting for command) -> busy
let wakeEnabled=false;
let armTimer=null, resultTimer=null, levelTimer=null;
let lastIntent=null;
const SR = 16000;

/* intent → icon + which device tile(s) to pop */
const ICON = {
  LIGHT_ON:'💡', LIGHT_OFF:'💡', BRIGHTNESS:'💡', COLOR:'🎨',
  PLAY_MUSIC:'🎵', PAUSE:'⏸️', STOP:'⏹️', NEXT:'⏭️',
  VOLUME_UP:'🔊', VOLUME_DOWN:'🔉',
  TEMPERATURE:'🌡️', TIMER:'⏱️', WEATHER:'🌤️',
  ALARM:'⏰', CREATE_REMINDER:'📝', LIST_REMINDERS:'📋',
};
const TILE = {
  LIGHT_ON:'light', LIGHT_OFF:'light', BRIGHTNESS:'light', COLOR:'light',
  PLAY_MUSIC:'music', PAUSE:'music', STOP:'music', NEXT:'music',
  VOLUME_UP:'music', VOLUME_DOWN:'music',
  TEMPERATURE:'temp', TIMER:'timer', WEATHER:'weather',
  ALARM:'lists', CREATE_REMINDER:'lists', LIST_REMINDERS:'lists',
};

/* ── websocket ── */
/* ── sound chimes (Web Audio, no assets) ────────────────────────── */
let chimeCtx=null;
function _ctx(){
  if(!chimeCtx) chimeCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(chimeCtx.state==='suspended') chimeCtx.resume();
  return chimeCtx;
}
function tone(freq, t0, dur, gain=0.22, type='sine'){
  const c=_ctx(), o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001, c.currentTime+t0);
  g.gain.exponentialRampToValueAtTime(gain, c.currentTime+t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+t0+dur);
  o.connect(g).connect(c.destination);
  o.start(c.currentTime+t0); o.stop(c.currentTime+t0+dur+0.03);
}
// chime #1 — wake word heard: bright ascending "ding-dong"
function chimeWake(){ tone(880,0,0.16,0.24); tone(1318.5,0.12,0.22,0.24); }
// chime #2 — command understood: soft descending "done"
function chimeDone(){ tone(659.3,0,0.16,0.20); tone(440,0.13,0.26,0.20); }

function connect(){
  const proto = location.protocol==='https:'?'wss':'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = ()=>{ $('conn').classList.add('live'); $('connTxt').textContent='connected';
                     ws.send(JSON.stringify({type:'start'})); };
  ws.onclose = ()=>{ $('conn').classList.remove('live'); $('connTxt').textContent='disconnected';
                      setTimeout(connect,1500); };
  ws.onmessage = ev=>{
    const m=JSON.parse(ev.data);
    if(m.type==='ready'){
      wakeEnabled = !!m.wake;
      setPhase('idle');
      startListen();
    }
    if(m.type==='wake'){ onWake(); }
    if(m.type==='result'){ onResult(m); }
    if(m.type==='state'){ renderTiles(m.state, null, {silent:true}); }
  };
}

/* ── continuous mic: always on, feeding the wake word ───────────── */
async function startListen(){
  if(recording) return;
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:{channelCount:1, echoCancellation:true, noiseSuppression:true}}); }
  catch(e){ alert('Microphone access denied. Allow mic permission and reload.'); return; }
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  const nativeRate = audioCtx.sampleRate;
  await audioCtx.audioWorklet.addModule('/static/pcm-capture.js', {credentials:'omit'});
  const src = audioCtx.createMediaStreamSource(stream);
  workletRef = new AudioWorkletNode(audioCtx, 'pcm-capture');
  workletRef.port.onmessage = (e)=>{
    const resampled = resampleLinear(e.data, nativeRate, SR);
    const pcm16 = new Int16Array(resampled.length);
    for(let i=0;i<resampled.length;i++){ let v=Math.max(-1,Math.min(1,resampled[i])); pcm16[i]=v<0?v*0x8000:v*0x7FFF; }
    if(ws && ws.readyState===1) ws.send(JSON.stringify({type:'audio', data: b64(pcm16.buffer)}));
  };
  analyser = audioCtx.createAnalyser(); analyser.fftSize=1024;
  src.connect(workletRef); src.connect(analyser);
  recording=true;
  startLevelLoop();
}
function startLevelLoop(){
  const data=new Uint8Array(analyser.frequencyBinCount);
  const tick=()=>{
    if(!recording) return;
    analyser.getByteFrequencyData(data);
    let sum=0; for(let i=0;i<data.length;i++) sum+=data[i];
    const lvl=Math.min(100,(sum/data.length)/2);
    $('level').style.width=lvl+'%';
    levelTimer=requestAnimationFrame(tick);
  }; tick();
}
function stopLevelLoop(){ if(levelTimer) cancelAnimationFrame(levelTimer); $('level').style.width='0'; }

/* ── phase machine ──────────────────────────────────────────────── */
function setPhase(p){
  phase=p;
  const orb=$('orb');
  orb.classList.toggle('armed', p==='armed');
  orb.classList.toggle('listening', p==='idle');
  if(p==='idle'){
    $('hint').innerHTML = wakeEnabled
      ? 'Say <b>&ldquo;hey jarvis&rdquo;</b> &mdash; I&rsquo;m listening.'
      : 'Tap the <b>orb</b> to record a command.';
  } else if(p==='armed'){
    $('hint').innerHTML='<b>Go ahead</b> &mdash; say your command now&hellip;';
  }
}
function onWake(){
  chimeWake();                 // chime #1
  setPhase('armed');           // orb turns blue, faster pulse
  clearTimeout(armTimer);
  armTimer=setTimeout(()=>{    // if nothing said in 3.5 s, go back to idle
    setPhase('idle');
  }, 3500);
}

/* ── a command came back: pop the panel ── */
function onResult(m){
  clearTimeout(armTimer);
  chimeDone();                 // chime #2
  lastIntent=m.intent;
  $('hero').style.display='flex';
  $('heroIc').textContent = ICON[m.intent] || '💬';
  $('intentName').textContent = m.name;
  $('statusMsg').textContent = m.status;
  $('conf').textContent = (m.confidence*100).toFixed(1)+'%';
  $('top3').innerHTML = m.top.map(t=>`<span class="chip">${t.label} <b>${(t.prob*100).toFixed(0)}%</b></span>`).join('');
  $('lat').textContent = `inference ${m.latency_ms} ms · CRNN · ONNX CPU`;
  addLog(m.name, m.status);
  renderTiles(m.state, m.intent);
  openPanel();
  setPhase('busy');
  clearTimeout(resultTimer);
  resultTimer=setTimeout(()=>{ closePanel(); setPhase('idle'); }, 2600);
}

/* ── render only the tile(s) relevant to the intent ── */
function renderTiles(s, intent, opts={}){
  const box=$('devices');
  const keys = intent ? (TILE[intent] ? [TILE[intent]] : []) : [];
  box.innerHTML = '';
  keys.forEach(k=>box.appendChild(buildTile(k,s)));
}
function buildTile(kind,s){
  const d=document.createElement('div'); d.className='dev';
  if(kind==='light'){
    d.innerHTML = `<div class="bulb ${s.lights_on?'on':''}"></div>
      <div class="lbl">Lights</div><div class="val">${s.lights_on?'On':'Off'}</div>
      <div class="sub">${s.brightness}% · ${s.color}</div>
      <div class="swatch" style="background:rgb(${s.rgb[0]},${s.rgb[1]},${s.rgb[2]})"></div>`;
  } else if(kind==='music'){
    const playing=s.music_playing;
    d.innerHTML = `<div class="ic">🎵</div><div class="lbl">Music</div>
      <div class="val">${playing?(s.paused?'Paused':'Playing'):'Stopped'}</div>
      <div class="meter"><i style="width:${s.volume}%"></i></div>
      <div class="sub">${playing?s.current_track+' · ':''}vol ${s.volume}%</div>`;
  } else if(kind==='temp'){
    d.innerHTML = `<div class="ic">🌡️</div><div class="lbl">Thermostat</div>
      <div class="val">${s.temperature}°C</div><div class="sub">range 16–30°C</div>`;
  } else if(kind==='timer'){
    d.innerHTML = `<div class="ic">⏱️</div><div class="lbl">Timer</div>
      <div class="timer-ring">${s.timer_active?fmt(s.timer_remaining):'—'}</div>
      <div class="sub">${s.timer_active?'counting down':'idle'}</div>`;
  } else if(kind==='weather'){
    d.innerHTML = `<div class="ic">🌤️</div><div class="lbl">Weather</div>
      <div class="val">${s.weather.temp_c}°C</div>
      <div class="sub">${s.weather.city} · ${s.weather.condition}</div>`;
  } else if(kind==='lists'){
    const bits=[]; if(s.alarms.length) bits.push('⏰ '+s.alarms.join(', '));
    if(s.reminders.length) bits.push('📝 '+s.reminders.join(', '));
    d.innerHTML = `<div class="ic">📋</div><div class="lbl">Alarms &amp; Reminders</div>
      <div class="sub" style="margin-top:6px">${bits.length?bits.join('<br>'):'none yet'}</div>`;
  }
  return d;
}
function fmt(sec){ const m=Math.floor(sec/60), s=sec%60; return m? `${m}m ${s}s` : `${s}s`; }

/* ── panel open/close ── */
function openPanel(){
  $('stage').classList.add('hidden');
  $('panel').classList.add('show');
}
function closePanel(){
  $('panel').classList.remove('show');
  $('stage').classList.remove('hidden');
}

/* ── activity log ── */
function addLog(name, msg){
  const ul=$('logList'); const empty=ul.querySelector('.empty'); if(empty) empty.remove();
  const li=document.createElement('li');
  li.innerHTML = `<span class="t">${new Date().toLocaleTimeString([], {hour12:false})}</span>
                  <span class="m">${name}</span><span>${msg.replace(/^[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/gu,'').trim()}</span>`;
  ul.prepend(li);
  while(ul.children.length>30) ul.lastChild.remove();
}

/* ── helpers ── */
function resampleLinear(x, from, to){
  if(from===to) return x;
  const n=Math.round(x.length*to/from), out=new Float32Array(n);
  for(let i=0;i<n;i++){ const pos=i*from/to, i0=Math.floor(pos), i1=Math.min(i0+1,x.length-1), f=pos-i0;
    out[i]=x[i0]*(1-f)+x[i1]*f; }
  return out;
}
function b64(buf){ let s=''; const bytes=new Uint8Array(buf);
  for(let i=0;i<bytes.length;i++) s+=String.fromCharCode(bytes[i]);
  return btoa(s); }

/* ── wiring ── */
let workletRef=null;
// tapping the orb is a fallback: with wake word off it records a command;
// with wake word on it just re-arms (harmless).
$('orb').onclick = ()=>{
  if(phase==='busy') return;
  if(!wakeEnabled){                       // tap-to-talk fallback
    setPhase('armed');
    ws.send(JSON.stringify({type:'start'}));
    clearTimeout(armTimer);
    armTimer=setTimeout(()=>setPhase('idle'), 4000);
  } else {
    setPhase('armed');                    // nudge: "go ahead"
    clearTimeout(armTimer);
    armTimer=setTimeout(()=>setPhase('idle'), 3500);
  }
};
$('againBtn').onclick = ()=>{ closePanel(); clearTimeout(resultTimer); setPhase('armed');
  clearTimeout(armTimer); armTimer=setTimeout(()=>setPhase('idle'), 4000); };
$('resetBtnTop').onclick = ()=> ws && ws.readyState===1 && ws.send(JSON.stringify({type:'reset'}));

/* init: load state so a refresh mid-session still shows correct tiles */
fetch('/api/state').then(r=>r.json()).then(s=>{ if(lastIntent) renderTiles(s,lastIntent); });
connect();
</script>
